<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamClipper — подключение TikTok</title>
<style>
  :root { --bg:#05060a; --text:#f5f5f7; --muted:#9b9ba7; --ok:#34d399; --err:#fb7185;
          --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 55%,#f43f5e 100%); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:520px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .grad { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .box { margin-top:18px; padding:16px; border-radius:14px; background:#0d1017;
         border:1px solid #1c2030; }
  .ok  { border-color:rgba(52,211,153,.4); }
  .err { border-color:rgba(251,113,133,.4); }
  .muted { color:var(--muted); font-size:14px; }
  .code { margin:12px 0; padding:12px; border-radius:10px; background:#000;
          border:1px dashed #2a2f40; word-break:break-all; font-family:ui-monospace,Menlo,Consolas,monospace;
          font-size:14px; color:#e5e7eb; min-height:44px; }
  button { width:100%; padding:14px; border-radius:12px; border:0; font-size:16px; font-weight:600;
           background:var(--grad); color:#fff; cursor:pointer; }
  .done { color:var(--ok); font-weight:600; }
  .bad  { color:var(--err); font-weight:600; }
  ol { margin:10px 0 0; padding-left:20px; color:var(--muted); font-size:14px; }
  ol li { margin:4px 0; }
  .b { color:#e5e7eb; font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <h1><span class="grad">StreamClipper</span> · TikTok</h1>
  <div id="st" class="box muted">Загрузка…</div>
</div>
<script>
(function () {
  var CLIENT_KEY = "sbawmt0yf6gs9z87ow";
  var SCOPE = "user.info.basic,video.upload,video.publish";
  var q = new URLSearchParams(location.search);
  var code = q.get("code") || "";
  var err = q.get("error_description") || q.get("error") || "";
  var st = document.getElementById("st");

  function esc(s) { return String(s).replace(/[<>&"]/g, ""); }

  if (!code && !err) {
    // Стартовый режим: собираем ссылку сами, никаких ручных копипаст
    st.className = "box";
    st.innerHTML =
      "<div>Страница подключения автопостинга TikTok.</div>" +
      "<div style='margin-top:12px'><b>Шаг 1.</b> Убедись, что в этом браузере ты уже " +
      "вошёл в TikTok под аккаунтом <span class='b'>@a4a4a4a4_omg</span> " +
      "(он добавлен в песочницу приложения).</div>" +
      "<div style='margin-top:8px'><b>Шаг 2.</b> Нажми кнопку ниже и подтверди доступ.</div>" +
      "<div style='margin-top:14px'><button id='go'>Войти через TikTok</button></div>" +
      "<div class='muted' style='margin-top:10px'>После входа TikTok вернёт тебя сюда с одноразовым кодом.</div>";
    document.getElementById("go").addEventListener("click", function () {
      var state = "";
      var bytes = new Uint8Array(8);
      (window.crypto || window.msCrypto).getRandomValues(bytes);
      for (var i = 0; i < bytes.length; i++) state += ("0" + bytes[i].toString(16)).slice(-2);
      try { sessionStorage.setItem("tt_state", state); } catch (e) {}
      var p = new URLSearchParams({
        client_key: CLIENT_KEY,
        scope: SCOPE,
        response_type: "code",
        redirect_uri: location.origin + location.pathname,
        state: state
      });
      location.href = "https://www.tiktok.com/v2/auth/authorize/?" + p.toString();
    });
    return;
  }

  if (err) {
    st.className = "box err";
    st.innerHTML = "<div class='bad'>TikTok вернул ошибку</div>" +
      "<div class='muted' style='margin-top:6px'>" + esc(err) + "</div>" +
      "<div class='muted' style='margin-top:8px'>Вернись назад и попробуй войти ещё раз.</div>";
    return;
  }

  // Код получен: проверяем state, показываем код
  var got = q.get("state") || "";
  var saved = "";
  try { saved = sessionStorage.getItem("tt_state") || ""; } catch (e) {}
  var stateOk = saved && got && saved === got;

  st.className = "box ok";
  st.innerHTML = "<div class='done'>Код получен — почти готово</div>" +
    (stateOk
      ? "<div class='muted' style='margin-top:4px'>Защитная проверка state: пройдена</div>"
      : "<div class='muted' style='margin-top:4px'>Защитная проверка state: не совпала (не критично, код всё равно действителен)</div>") +
    "<div class='code' id='cd'></div>" +
    "<button id='cp'>Скопировать код</button>" +
    "<div class='muted' style='margin-top:12px'>Осталось два шага:</div>" +
    "<ol><li>Нажми «Скопировать код»</li>" +
    "<li>Пришли скопированную строку ассистенту в чат — он завершит подключение за минуту</li></ol>";
  document.getElementById("cd").textContent = code;

  function finish() {
    document.getElementById("cp").textContent = "Скопировано";
  }
  function legacy() {
    var ta = document.createElement("textarea");
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); finish(); } catch (e) {}
    document.body.removeChild(ta);
  }
  document.getElementById("cp").addEventListener("click", function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(finish, legacy);
    } else { legacy(); }
  });
})();
</script>
</body>
</html>
