<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamClipper — вход в TikTok</title>
<style>
  :root { --bg:#05060a; --text:#f5f5f7; --muted:#9b9ba7;
          --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 55%,#f43f5e 100%); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:520px; text-align:center; }
  h1 { font-size:22px; margin:0 0 6px; }
  .grad { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .muted { color:var(--muted); font-size:14px; margin-top:10px; }
  button { margin-top:18px; padding:14px 28px; border-radius:12px; border:0; font-size:16px; font-weight:600;
           background:var(--grad); color:#fff; cursor:pointer; }
  .link { word-break:break-all; }
</style>
</head>
<body>
<div class="card">
  <h1><span class="grad">StreamClipper</span> · вход в TikTok</h1>
  <div id="st" class="muted">Сейчас переброшу на страницу входа TikTok…</div>
  <button id="go">Войти в TikTok</button>
  <div class="muted" id="fallback" hidden></div>
</div>
<script>
(function () {
  var CLIENT_KEY = "awhewj5igia1ru56";
  var SCOPE = "user.info.basic,video.upload,video.publish";
  var REDIRECT = "https://qwied.github.io/TikTokAuto/tiktok-connect.html";
  var STATE = "sclink" + Math.floor(Date.now() / 1000);
  var url = "https://www.tiktok.com/v2/auth/authorize/?" +
    "client_key=" + encodeURIComponent(CLIENT_KEY) +
    "&scope=" + encodeURIComponent(SCOPE) +
    "&response_type=code" +
    "&redirect_uri=" + encodeURIComponent(REDIRECT) +
    "&state=" + encodeURIComponent(STATE);

  var st = document.getElementById("st");
  var fb = document.getElementById("fallback");
  fb.hidden = false;
  fb.innerHTML = 'Если переброска не сработала — открой эту ссылку вручную:<br>' +
    '<a class="link" href="' + url + '" style="color:#8b5cf6">' + url + "</a>";
  document.getElementById("go").addEventListener("click", function () {
    location.replace(url);
  });
  setTimeout(function () { location.replace(url); }, 800);
})();
</script>
</body>
</html>
