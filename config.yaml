# ============================================================
#  StreamClipper 2.0 — конфигурация
#  Меняйте значения и перезапускайте программу.
# ============================================================

# --- ССЫЛКИ НА КАНАЛЫ (главное) --------------------------------
# Просто вставьте ссылки на каналы стримеров. Программа сама
# определит платформу (Twitch / YouTube), будет проверять канал
# каждую секунду и АВТОМАТИЧЕСКИ зайдёт на стрим, как только он
# начнётся. Каналы можно также добавлять на ходу:
#   - в файл links.txt (по одной ссылке в строке);
#   - или боту в Telegram (см. notify.telegram).
channels:
#   - "https://www.twitch.tv/имя_стримера"
#   - "https://www.youtube.com/@имя_канала"
#   - "https://www.youtube.com/channel/UCxxxxxxxx"

# Дополнительный файл со ссылками (удобно править на ходу):
links_file: "links.txt"

# Как быстро замечать выход в эфир (сек между проверками):
# используются быстрые внутренние API платформ, поэтому можно часто.
monitor:
  poll_twitch: 2        # Twitch: ОДИН пакетный запрос на все каналы каждые ~2 c
  poll_youtube: 4       # каждый YouTube-канал проверяется каждые ~4 c
  yt_workers: 3         # сколько YouTube-каналов проверять одновременно

# --- Автопоиск ЛУЧШИХ СТРИМОВ Twitch ---------------------------
# Бот САМ заходит на Twitch и берёт в слежку топовые эфиры по числу
# зрителей (без ключей и регистрации). Каналы, которые вы добавили сами,
# никогда не трогаются и не удаляются — автопоиск только ДОПОЛНЯЕТ их.
# Хотите только свои каналы — поставьте enabled: false.
discovery:
  enabled: true
  count: 80             # сколько русскоязычных стримеров держать в слежке
                        # (2026-11-24: было 60 — запрос «включи ещё тех, кто
                        # популярный именно русскоязычный»; пул кандидатов
                        # в gh_run.py тоже расширен +20 крупных каналов)
  min_viewers: 400      # отсечка по зрителям: снижена с 800 — теперь в слежку
                        # попадают и средние эфиры популярных русских каналов
                        # (мелкие всё равно отсекает контроль качества после
                        # нарезки)
  refresh_min: 20       # как часто обновлять топ (минут)
  language: "ru"        # ТОЛЬКО русскоязычные стримеры ("" = все языки)

# --- YouTube-дискавери: авто-поиск популярных РУССКИХ видео -------------------
# ВЫКЛЮЧЕНО 2026-11-24 (запрос пользователя: «нарезку делай ТОЛЬКО по моим
# запросам»): автопоиск больше не докидывает чужие видео в очередь.
# Нарезка теперь только по ссылкам из окна youtube-clipper.html на сайте
# и по записям эфиров отслеживаемых стримеров. Вернуть авто-поиск:
#   enabled: true
youtube_discover:
  enabled: false
  queries:              # поисковые запросы (русскоязычные, тема любая)
    - "ru:смешные моменты стрима"
    - "ru:приколы стримеров"
    - "ru:лучшие моменты"
    - "ru:стрим угар"
    - "ru:стример взбесился"
    - "ru:русские стримы"
    - "ru:пранк"
    - "ru:хайп"
    - "ru:подкаст"
    - "ru:шоу"
    - "ru:стендап"
    - "ru:интервью"
    - "ru:обзор"
    - "ru:эксперимент"
  min_views: 50000      # минимум просмотров у видео
  min_minutes: 8        # короче 8 минут = Shorts/нарезки — мимо
  max_minutes: 180      # длиннее 3 часов — мимо (марафоны)
  max_per_check: 2      # сколько видео докидывать в очередь за проверку
  results_per_query: 10 # сколько результатов смотреть по каждому запросу
  queue_max: 10         # не докидывать, если в очереди уже столько задач

# --- YouTube: только если YouTube просит «подтвердите, что вы не робот» ----
# Обычно НЕ нужно. Если запись YouTube вдруг перестала работать:
#   cookies_file — экспортируйте cookies из браузера в файл (расширение
#     «Get cookies.txt LOCALLY») и укажите путь, например "cookies.txt";
#   cookies_from_browser — или просто имя браузера: chrome | firefox | edge.
youtube:
  cookies_file: ""
  # Живые cookies прямо из браузера (локальный запуск на ноутбуке):
  # YouTube протухает файловые cookies за минуты (ротация сессии), а
  # cookies-from-browser всегда свежие. На GitHub Actions не действует —
  # там стримы YouTube всё равно закрыты для датацентровых IP (2026-11-25).
  cookies_from_browser: "chrome"

# Язык речи стримера для субтитров: ru | en | auto
speech_language: ru

# --- Клипы ----------------------------------------------------
clip:
  # ДЛИНА КЛИПА ПО СИЛЕ МОМЕНТА (auto): обычный момент — 35 секунд
  # (лучший % досмотра в TikTok), хороший — 45, жирный хайп — 60.
  # Хвост тянется до первой ПАУЗЫ речи (+ до 10 c): клип заканчивается
  # на конце фразы, а не посреди слова. Число вместо auto = фиксированная
  # длина (например 60).
  total: auto
  logical_tail: 10      # максимальный «хвост до паузы» после расчётного конца, сек
  pre_roll: 30          # (при total: auto пересчитывается под фактическую длину)
  post_roll: 30         # (при total: auto пересчитывается под фактическую длину)
  cooldown: 180         # минимальная пауза между клипами, сек
  max_per_hour: 6       # не больше клипов в час с одного канала
  quality: "best"       # МАКСИМАЛЬНОЕ КАЧЕСТВО: пишется исходный поток (1080p60/1440p — как у стримера), без понижения
  # --- Формат TikTok 9:16 (вертикальный) ---
  # Каждый клип готовится вертикальным 1080x1920 (как в TikTok).
  # vertical_mode: split — МАКЕТ «СТРИМЕР СВЕРХУ, ИГРА СНИЗУ» (по фото-примеру
  #   IMG_3624): вебкамера стримера определяется автоматически (по лицу в кадре,
  #   теперь с двойной попыткой на полном разрешении — мелкие/тёмные камеры
  #   больше не теряются) и занимает верхнюю часть экрана, игра — нижнюю;
  #   обе секции во всю ширину, весь экран TikTok без полос. Если камеру найти
  #   не удалось — клип собирается как 9:16-КРОП (vertical_fallback): весь
  #   экран занят, БЕЗ размытых полос (они признаны «кривыми соотношениями
  #   сторон»).
  # vertical_fallback: crop — чем заполнять экран, когда камеры нет (crop —
  #   весь экран; blur — старый вариант с размытыми полосами).
  # vertical_mode: blur — стрим по центру, фон из размытого видео.
  # vertical_mode: crop — обрезка краёв, весь экран.
  vertical: true
  vertical_mode: split
  vertical_fallback: crop
  # --- Замазка ЧУЖИХ банеров и рекламы ---
  # Слой 1 — детект статичных оверлеев стримера (виджеты донатов с непрозрачной
  # панелью, соцсети, спонсорские плашки, логотипы) и замазка их blur-ом.
  # Слой 2 — константная замазка ВЕРХНИХ УГЛОВ кадра (mask_corners): полупрозрачные
  # и анимированные виджеты («цель 51%», бегущие строки) просвечивают фон и потому
  # невидимы детекту, но висят почти всегда в верхних углах. Внимание: если камера
  # стримера находится в верхнем углу, она тоже замывается (mask_corners: false —
  # чтобы оставить). Баннер RubUp накладывается ПОСЛЕ — его замазка не трогает.
  # Окно камеры стримера ИСКЛЮЧАЕТСЯ из замазки автоматически: вебкамера
  # статична и выглядит детектору «чужим баннером» (маска накрывала лицо —
  # прод 2026-11-20).
  hide_overlays: true
  mask_corners: true

# --- Что считать хайпом ---------------------------------------
hype:
  window: 5.0           # окно анализа чата, сек
  threshold: 52         # порог срабатывания 0-100 (меньше = чаще клипы)
  sustain: 2            # сколько замеров подряд держится хайп (1 сек каждый)
  min_users: 3          # минимум разных авторов в окне (отсекает ботов)
  # Гарантированная нарезка: если хайпа нет дольше 12 минут, клип снимается
  # всё равно — причём ЛУЧШИЙ момент за последние 4 минуты (по скорости чата,
  # восторженным сообщениям и числу авторов), а не случайная минута.
  # 0 = ждать только хайп. Периодичность ограничена cooldown и max_per_hour.
  max_idle_min: 12
  keywords:             # слова восторга; смех и КАПС ловятся всегда
    - ахах
    - хахах
    - аааа
    - оооо
    - рофл
    - кек
    - лол
    - пгг
    - гоол
    - клип
    - жесть
    - шок
    - ойбой
    - огонь
    - боже
    - pog
    - poggers
    - kekw
    - lul
    - lol
    - lmao
    - rofl
    - clip
    - hype
    - wtf

# --- Субтитры: ТОЛЬКО РЕЧЬ ЧЕЛОВЕКА (движок PeakCut) ------------
# Whisper распознаёт голос; чат НЕ отслеживается.
# Движок PeakCut (порт с GitHub, MIT): активное слово красится и
# «выпрыгивает» (поп-анимация), слова положены по одному точной
# геометрией шрифта, сверху плашка-крючок (белый бокс с заголовком).
# При любой ошибке автоматом включаются прежние караоке-субтитры.
subtitle:
  enabled: true
  style: peakcut        # peakcut (поп-караоке + крючок) | tiktok (бело-жёлтый капс) | classic
  peakcut_style: bounce # bounce (жёлтое активное слово) | hype (красное, крупнее) | clean (спокойный)
  peakcut_hook: false   # ВЫКЛЮЧЕНО (просьба пользователя): белый бокс с тёмным текстом
  model: small          # tiny (быстро) | base | small (точнее); при первом запуске скачается
  beam_size: 3          # 1 = быстро, 3 = точнее (если распознавание слабое — лестница поднимет до 5)
  fallback_chat: false  # ВЫКЛЮЧЕНО по требованию: субтитры ТОЛЬКО из речи, чат не отслеживается
  use_asr: true         # распознавать РЕЧЬ ЧЕЛОВЕКА
  # ЛИП-СИНК (гейт по движению рта): ВКЛЮЧЁН по требованию пользователя —
  # «субтитры следят ИМЕННО за губами стримера». Реплики из игры/войсчата,
  # на которых стример молчит, в субтитры не попадают. Надёжность решена
  # двумя механизмами (прод-инцидент exigent_wires 2026-11-21 больше не
  # повторяется): 1) лицо ищет YuNet (neural-детектор из OpenCV Zoo, вшит
  # в репо) вместо старого Хаара; 2) арбитраж «губы vs аудио-VAD» в
  # subtitle._lip_gate — если детект рта сломан (тёмное лицо, рывки камеры),
  # гейт САМ выключается и субтитры остаются по аудио.
  lip_sync: true
  # Шрифт «TikTok»-стиля: Montserrat ExtraBold ВШИТ В ПРОГРАММУ (папка fonts/)
  # — жирный, с полной кириллицей; выглядит одинаково на Windows и GitHub
  # Actions (раньше Actions подставляли тонкий системный шрифт — выглядело
  # «криво»). Свой шрифт: положите .ttf в fonts/ и впишите его имя семьи.
  font: "Montserrat ExtraBold"

# --- Пауза нарезки во время рекламы (RubAp / RubUp) -------------
# Когда на стриме начинается реклама, НАРЕЗКА СТАВИТСЯ НА СТОП,
# а после её окончания ПРОДОЛЖАЕТСЯ автоматически.
#   * автоматически ловится серверная реклама (маркеры в HLS-плейлисте);
#   * рекламу, которую стример включает сам поверх эфира (RubAp/RubUp
#     и т.п.), помечают кнопкой РЕКЛАМА на сайте — один тап «началась»,
#     второй тап «кончилась»;
#   * сегменты, записанные во время рекламы, в клипы НЕ попадают.
ad:
  enabled: true
  poll: 4               # как часто проверять плейлист, сек
  # Маркеры рекламы в плейлисте (можно дополнить своими):
  # markers:
  #   - twitch-stitched-ad
  #   - ext-x-cue-out

# --- Рекламный баннер в каждой нарезке (RubUP) ------------------
# Правила рекламодателя соблюдаются автоматически:
#   * пока идёт баннер, НАРЕЗКА НА ПАУЗЕ: кадр стрима замирает, звук
#     стрима молчит; после окончания ролика RubUP эфир продолжается;
#   * баннер идёт СО ЗВУКОМ (звук самого ролика RubUP);
#   * занимает НЕ МЕНЬШЕ 25% площади экрана (по умолчанию ~30% с запасом);
#   * стоит ПО ЦЕНТРУ кадра — не в углу;
#   * показ идёт ПО СЕРЕДИНЕ клипа: «крючок» момента в начале и финал
#     остаются чистыми (banner.start: middle);
#   * в клипе длиннее минуты баннер показывается раз в минуту.
# Другой баннер: просто замените файл banner.mp4 рядом с программой.
banner:
  enabled: true
  file: "banner.mp4"   # ролик рекламодателя (RubUP), лежит рядом с программой
  area: 30             # площадь экрана под баннер, % (минимум 25 по правилам)
  start: middle        # ПО СЕРЕДИНЕ клипа (начало и финал чистые); число = показ на этой секунде
  volume: 1.0          # громкость звука баннера

# --- Скорость финальной обработки ------------------------------
processing:
  encoder: auto         # auto: NVENC (видеокарта) -> Intel QSV -> AMD AMF -> x264
  workers: 2            # сколько клипов обрабатывать одновременно

# --- Уведомления НА ЛЮБОЕ УСТРОЙСТВО ---------------------------
# provider: один канал (telegram | ntfy | bark | pushover | webhook)
# или "all" — разослать клип на ВСЕ настроенные ниже каналы.
notify:
  provider: telegram
  telegram:
    bot_token: "ВСТАВЬТЕ_ТОКЕН_ОТ_BOTFATHER"
    chat_id: "ВСТАВЬТЕ_ВАШ_CHAT_ID"
    accept_commands: true   # бот принимает ссылки и команды (/list, /status, /clip)
  ntfy:                   # приложение ntfy (Android/iOS): придумайте уникальный topic
    server: "https://ntfy.sh"
    topic: ""
  bark:                   # приложение Bark (iPhone): скопируйте ссылку из приложения
    device_key: ""
  pushover:               # приложение Pushover (Android/iOS)
    user_key: ""
    api_token: ""
  webhook:                # любой ваш сервис (Home Assistant, Discord-прокси и т.п.)
    url: ""
    secret: ""

# --- Запись (кольцевой буфер) ------------------------------------
recorder:
  segment_time: 2       # длина сегмента буфера, сек (меньше = точнее границы клипа)
  buffer_keep: 300      # сколько секунд потока держать на диске (>= pre_roll + 60)

# --- Файлы --------------------------------------------------------
storage:
  clips_dir: "clips"    # готовые клипы
  temp_dir: "temp"      # рабочие файлы и буфер записи
  keep_temp: false      # true — не удалять промежуточные файлы клипов

# --- Веб-интерфейс (телефон + GitHub Pages) ------------------------
server:
  enabled: true
  port: 8765
  docs_dir: "."         # файлы сайта лежат рядом с программой (в корне)
  public_base_url: ""   # если настроен https-туннель (cloudflared) — укажите адрес

# --- Автопостинг в TikTok (само выкладывается) ------------------
# Режимы:
#   browser — окно Chrome, вы залогинены в TikTok (cookies.txt из браузера,
#             расширение «Get cookies.txt LOCALLY» на сайте tiktok.com).
#             Начать проще всего; TikTok иногда показывает капчу — окно
#             открыто, решаете руками. Chrome должен быть установлен.
#   api     — официальный TikTok Content Posting API (надёжнее, без капчи):
#             1) developers.tiktok.com -> Create app (Content Posting API);
#             2) вписать client_key/client_secret ниже;
#             3) python tiktok_auth.py — войти в TikTok, токен сохранится;
#             БЕЗ аудита приложения видео уходят в «Только я» (SELF_ONLY),
#             после аудита можно PUBLIC_TO_EVERYONE.
# dry_run: true — НЕ выкладывает, только пишет в лог (проверка настройки).
tiktok:
  enabled: true          # на GitHub Actions включается и так — из секретов
                         # (TIKTOK_CLIENT_KEY/SECRET/REFRESH_TOKEN); true = и локально
  mode: api              # api | browser (api — официальный Content Posting API)
  cookies_file: "tiktok_cookies.txt"   # mode browser: cookies с tiktok.com
  client_key: ""         # mode api (на Actions придёт из секретов)
  client_secret: ""      # mode api (на Actions придёт из секретов)
  redirect: "http://localhost:8321/callback"   # mode api (прописать в приложении)
  token_file: "tiktok_tokens.json"             # mode api (создаёт tiktok_auth.py)
  privacy: "PUBLIC_TO_EVERYONE"   # цель: ПУБЛИЧНЫЕ публикации. TikTok без аудита
                         # приложения отклоняет PUBLIC (и пост с публичным
                         # аккаунтом целиком) — тогда модуль сам пробует
                         # SELF_ONLY и сохраняет клип в очередь
                         # tiktok_pending.json: после аудита всё выйдет
                         # ПУБЛИЧНО автоматически, ничего вручную делать не надо
  min_score: 65          # в TikTok публикуются только клипы с оценкой выше
                         # И ОБЯЗАТЕЛЬНО с речью (тихие окна не постим: каждый
                         # пост должен конкурировать за рекомендации). 65 =
                         # порог понижен с 70, чтобы клипам уровня 68 тоже
                         # уходить (выше порога всё равно стоит гейт речи)
  max_per_run: 4         # максимум постов за один запуск Actions (антибан)
  max_per_day: 30        # СУТОЧНЫЙ лимит: не больше 30 постов за календарные
                         # сутки (антибан TikTok — сотни постов за день = бан
                         # аккаунта). Клипы сверх лимита ждут в отложенной
                         # очереди tiktok_pending.json и выходят в следующие
                         # дни (по ~30 в день, пока очередь не разгрузится)
  day_start_hour: 9      # дневное окно публикаций: 30 постов в окне 09-23
  day_end_hour: 23       # = пауза ~28 минут между постами (поэтапно весь день)
  spread_through_day: true  # равномерно распределять посты по дневному окну
  hashtags:              # базовые хэштеги описания (лучшие для рекомендаций);
                         # игровые (#cs2, #dota2, #standoff2…) подмешиваются
                         # автоматически по названию стрима (см. GAME_TAGS в
                         # tiktok.py) — конкретные теги дают сильнее охват
    - fyp
    - foryou
    - рек
    - рекомендации
    - стрим
    - клипы
    - прикол
    - хайп
    - twitch
    - viral
