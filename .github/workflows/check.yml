# StreamClipper: ПОСТОЯННОЕ слежение за каналами.
#
# Как достигается скорость: cron GitHub не бывает чаще 5 минут, поэтому
# проверка работает ЭСТАФОТОЙ. Одна задача живёт до 55 минут и ВСЁ ЭТО ВРЕМЯ
# держит постоянный монитор: платформенные API опрашиваются каждые ~2-3
# секунды, статус читается каждые ~15 секунд. В конце задача запускает
# следующую — слежение идёт без пауз, а выход стримера в эфир замечается
# за считанные секунды. Cron ниже — только запасной вход, если эстафетная
# цепочка где-то оборвалась.
#
# Запуски идут через личный токен SC_PAT: от встроенного GITHUB_TOKEN GitHub
# МОЛЧА НЕ ВЫПОЛНЯЕТ запуски workflow из workflow (защита от рекурсии).
name: Check live

on:
  schedule:
    # запасной вход: каждые 5 минут (максимум GitHub) — основное — эстафета
    - cron: "*/5 * * * *"
  workflow_dispatch: {}            # кнопка «Run» вручную

permissions:
  contents: write                  # обновить clips.json / jobs.json
  actions: write                   # запустить Monitor / Clip video

concurrency:
  group: check-live
  cancel-in-progress: false   # НЕ убивать идущую смену: новый запуск подождёт
                              # в очереди и начнётся сразу после текущей —
                              # слежение идёт без пауз (смена за сменой)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: pip install streamlink yt-dlp requests PyYAML numpy

      - name: Постоянное слежение (55 мин, монитор каждые ~2-3 c, статус ~15 c)
        env:
          GH_TOKEN: ${{ secrets.SC_PAT }}   # PAT — без него Monitor не стартует
        run: python gh_run.py --check-loop --max-minutes 55

      # Эстафета: следующая смена слежения. if: always() — цепочка
      # продолжается, даже если проверка упала.
      - name: Эстафета — запустить следующую проверку
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.SC_PAT }}
        run: |
          sleep 5
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
