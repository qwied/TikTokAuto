# StreamClipper: проверка эфиров каждые ~5 минут.
# Кто-то стримит -> запускается Monitor (он сам всё нарежет и опубликует).
#
# ВАЖНО (починено): раньше проверка запускала Monitor через встроенный
# GITHUB_TOKEN — а GitHub МОЛЧА НЕ ВЫПОЛНЯЕТ такие запуски (защита от
# рекурсии), поэтому слежение никогда не стартовало само. Теперь запуски
# идут через личный токен SC_PAT. Вторая проблема: cron GitHub в маленьких
# репозиториях часто опаздывает/пропускает запуски. Поэтому проверка
# работает как ЭСТАФЕТА: в конце каждого запуска он сам запускает
# следующий. Cron остаётся запасным вариантом.
name: Check live

on:
  schedule:
    # запасной вход: каждые 5 минут (GitHub может задерживать)
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch: {}            # кнопка «Run» вручную

permissions:
  contents: write                  # обновить clips.json (статусы каналов)
  actions: write                   # запустить Monitor

concurrency:
  group: check-live
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: pip install streamlink yt-dlp requests PyYAML

      - name: Проверить эфиры и запустить Monitor
        env:
          GH_TOKEN: ${{ secrets.SC_PAT }}   # PAT — без него Monitor не стартует
        run: python gh_run.py --check

      # Эстафета: следующий запуск через ~4.5 мин сна + ~1 мин проверки.
      # if: always() — цепочка продолжается, даже если проверка упала.
      - name: Эстафета — запустить следующую проверку
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.SC_PAT }}
        run: |
          sleep 270
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
