# Быстрая проверка на раннере: детекция смеха/криков (moments.py + YAMNet) и
# автопостинг TikTok (суточный лимит, журнал постов, очередь).
# Запуск: Actions -> Smoke tests -> Run workflow.
name: Smoke tests

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости (numpy + litert + ffmpeg)
        run: |
          pip install numpy ai-edge-litert requests
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Тест детекции моментов (YAMNet)
        run: python test_moments.py banner.mp4

      - name: Тест автопостинга TikTok (дневной лимит 30/день)
        run: python test_tiktok.py
