# StreamClipper: сессия слежения за эфиром.
# Запускается автоматически из Check live, когда стример вышел в эфир.
# Режет клипы 60 сек (9:16 TikTok) с субтитрами и баннером RubUP,
# заливает их в Releases и обновляет clips.json; TikTok — из секретов.
name: Monitor

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Канал (ссылка) — можно оставить пустым"
        required: false
        default: ""
  schedule:
    # Резервный вход: каждые 5 минут (максимум GitHub). Если Check live
    # и Watchdog вдруг все разом молчат — Monitor сам проверит эфир.
    # Никто не стримит — быстрый выход (~1 мин);
    # кто-то стримит — начнётся сессия слежения.
    - cron: "*/5 * * * *"

permissions:
  contents: write                  # релизы + коммиты clips.json
  actions: write                   # финальная проверка может перезапустить Monitor

concurrency:
  group: monitor-v2                # 2026-11-24: группа переименована — старая
                                   # была забита зависшим запуском (cancel API
                                   # не сработал), новые сессии ждали его часами
  cancel-in-progress: false        # не убивать идущую запись

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 130           # сессия живёт максимум ~100 мин + ~15 мин на
                                   # старт/финал: раньше 350 — и зависшая смена
                                   # («зомби») молча блокировала слежку на часы
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Кэш модели Whisper (субтитры)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      # AI-заголовки TikTok (клипы из эфира): та же модель, что и в Clip
      - name: Кэш LLM (AI-заголовки)
        uses: actions/cache@v4
        with:
          path: ~/.cache/streamclipper-ai
          key: ai-llm-qwen15b-v1

      - name: AI-модель заголовков (Qwen 1.5B, локально, бесплатно)
        run: |
          mkdir -p ~/.cache/streamclipper-ai
          F=~/.cache/streamclipper-ai/qwen2.5-1.5b-instruct-q4_k_m.gguf
          if [ ! -s "$F" ] || [ $(stat -c%s "$F") -lt 400000000 ]; then
            curl -sL --retry 3 -o "$F" \
              https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          fi
          ls -la ~/.cache/streamclipper-ai/

      - name: Зависимости
        run: pip install streamlink yt-dlp requests PyYAML numpy websocket-client faster-whisper pywebpush llama-cpp-python "opencv-python-headless>=4.9,<5"

      # КРИТИЧНО: на раннере нет ffmpeg — без него запись эфира невозможна
      # (в логе это выглядело как «ffmpeg не найден» и «Буфер пуст»).
      - name: FFmpeg (запись и склейка клипов)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Слежу за эфиром и нарезаю клипы
        env:
          GH_TOKEN: ${{ secrets.SC_PAT }}   # PAT: релизы, коммиты, перезапуск
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_BOT_TOKEN }}
          NOTIFY_TELEGRAM_CHAT_ID: ${{ secrets.NOTIFY_TELEGRAM_CHAT_ID }}
          NOTIFY_NTFY_TOPIC: ${{ secrets.NOTIFY_NTFY_TOPIC }}
          NOTIFY_NTFY_SERVER: ${{ secrets.NOTIFY_NTFY_SERVER }}
          NOTIFY_BARK_DEVICE_KEY: ${{ secrets.NOTIFY_BARK_DEVICE_KEY }}
          NOTIFY_PUSHOVER_USER_KEY: ${{ secrets.NOTIFY_PUSHOVER_USER_KEY }}
          NOTIFY_PUSHOVER_API_TOKEN: ${{ secrets.NOTIFY_PUSHOVER_API_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
        run: python gh_run.py --monitor --channel "${{ inputs.channel }}" --max-minutes 100
        # --max-minutes 100 (было 280): смена короче — зависший прогон не
        # держит ворота «Monitor уже работает» часами; после смены финальная
        # проверка сама запустит следующую сессию, если эфир продолжается.

      # Сессия закончилась (лимит времени или эфир кончился): проверяем
      # ещё раз. Если эфир ПРОДОЛЖАЕТСЯ — запускаем новую сессию Monitor
      # (цепочка: пока стрим идёт — слежение не прерывается). Запуск через
      # SC_PAT: от GITHUB_TOKEN GitHub такие запуски молча не выполняет.
      - name: Финальная проверка — эфир продолжается?
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.SC_PAT }}
        run: python gh_run.py --check

      # Эстафета: после любой сессии Monitor перезапускаем Check live,
      # чтобы цикл «проверка каждые ~5 минут» гарантированно продолжался,
      # даже если эстафетная цепочка Check где-то оборвалась.
      - name: Эстафета — перезапустить Check live
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.SC_PAT }}
        run: gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
