# StreamClipper: сессия слежения за эфиром.
# Запускается автоматически из Check live, когда стример вышел в эфир.
# Режет клипы 60 сек (9:16 TikTok) с субтитрами и баннером RubUP,
# заливает их в Releases и обновляет clips.json; TikTok — из секретов.
name: Monitor

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Канал (ссылка) — можно оставить пустым"
        required: false
        default: ""

permissions:
  contents: write                  # релизы + коммиты clips.json
  actions: write                   # финальная проверка может перезапустить Monitor

concurrency:
  group: monitor
  cancel-in-progress: false        # не убивать идущую запись

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350           # чуть меньше лимита задачи (6 ч)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Кэш модели Whisper (субтитры)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Зависимости
        run: pip install streamlink yt-dlp requests PyYAML websocket-client faster-whisper pywebpush

      - name: Слежу за эфиром и нарезаю клипы
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_BOT_TOKEN }}
          NOTIFY_TELEGRAM_CHAT_ID: ${{ secrets.NOTIFY_TELEGRAM_CHAT_ID }}
          NOTIFY_NTFY_TOPIC: ${{ secrets.NOTIFY_NTFY_TOPIC }}
          NOTIFY_NTFY_SERVER: ${{ secrets.NOTIFY_NTFY_SERVER }}
          NOTIFY_BARK_DEVICE_KEY: ${{ secrets.NOTIFY_BARK_DEVICE_KEY }}
          NOTIFY_PUSHOVER_USER_KEY: ${{ secrets.NOTIFY_PUSHOVER_USER_KEY }}
          NOTIFY_PUSHOVER_API_TOKEN: ${{ secrets.NOTIFY_PUSHOVER_API_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
        run: python gh_run.py --monitor --channel "${{ inputs.channel }}"

      # Сессия закончилась (лимит времени или эфир кончился): проверяем
      # ещё раз. Если эфир ПРОДОЛЖАЕТСЯ — запускаем новую сессию Monitor
      # (цепочка: пока стрим идёт — слежение не прерывается, даже если
      # cron GitHub задерживается). Если никто не в эфире — тихий выход.
      - name: Финальная проверка — эфир продолжается?
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python gh_run.py --check
